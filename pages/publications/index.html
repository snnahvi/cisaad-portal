<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CISAAD Publications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  /* UMBC brand (styleguide.umbc.edu): Inter; primary Black + Gold;
     secondary AOK Teal (links), Dark Gray (muted text), Light Gray (lines) as accents only.
     Gold is never used as text on white, and white text is never put on gold. */
  :root{--text:#000;--muted:#636466;--rule:#636466;--link:#007176;--bg:#fff;
        --gold:#fdb515;--gold-tint:#fee9b3;--line:#c7c8ca;--soft:#f4f4f5}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg)}
  body{color:var(--text);font:16px/1.6 "Inter var","Inter","Helvetica Neue",Helvetica,Arial,sans-serif}
  .wrap{padding:0 4px}
  a{color:var(--link);text-decoration:underline}
  a:hover{text-decoration:none}
  hr{border:0;border-top:1px solid var(--rule);margin:8px 0}
  /* filter bar: section buttons + year + search */
  .filters{margin:12px 0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{font:inherit;font-size:14px;font-weight:600;line-height:1.2;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}
  .chip:hover{border-color:var(--gold);background:#fff8e6}
  .chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#000}
  .chip .n{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
  .chip[aria-pressed="true"] .n{color:#000}
  .tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 8px}
  .tools select,.tools input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text)}
  .tools input{width:260px;max-width:100%}
  .tools select:focus,.tools input:focus,.chip:focus-visible{outline:2px solid var(--link);outline-offset:2px}
  mark{background:var(--gold-tint);color:#000;padding:0 1px;border-radius:2px;box-shadow:inset 0 -2px 0 var(--gold)}
  /* filter bar stays at the top while the list scrolls */
  #nav{position:sticky;top:0;z-index:5;background:var(--bg)}
  #nav hr:last-child{margin-bottom:0}
  @media (max-width:600px){
    /* phones: one swipeable row of filter buttons instead of four rows */
    .chips{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:none}
    .tools{flex-wrap:nowrap}
    .tools select{flex:none}
    .tools input{flex:1;width:auto;min-width:0}
  }
  .count{text-align:center;color:var(--muted);font-size:14px;margin:4px 0 8px}
  h3{font-size:21.6px;line-height:1.3;font-weight:700;margin:28px 0 14px;scroll-margin-top:8px;padding-bottom:6px;border-bottom:3px solid var(--gold);display:inline-block}
  /* publication cards */
  .cards{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:12px}
  .card{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:14px 16px;background:#fff;transition:box-shadow .15s}
  .card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .card-top{display:flex;gap:12px;align-items:flex-start}
  .year{flex:none;font-size:13px;font-weight:700;color:var(--gold);background:#000;border-radius:999px;padding:2px 10px;margin-top:2px}
  .pub-text{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
  .pub-title{font-size:17px;font-weight:600;line-height:1.4;color:var(--text);margin:0 0 4px}
  .pub-meta{font-size:14px;color:var(--muted);line-height:1.5}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .btn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:600;line-height:1;padding:7px 12px;border-radius:6px;border:1px solid var(--link);color:var(--link);background:#fff;text-decoration:none;cursor:pointer}
  .btn:hover{background:var(--link);color:#fff;text-decoration:none}
  .btn svg{width:14px;height:14px;flex:none}
  h3 .n{font-size:15px;font-weight:400;color:var(--muted);margin-left:6px}
  .status{color:var(--muted);padding:16px 0}
  .video{position:relative;width:100%;max-width:560px;aspect-ratio:16/9;margin:12px 0 0;background:#f2f2f2}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
</style>
</head>
<body>
<div class="wrap">
  <div id="nav"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <div id="list"><p class="status">Loading publications…</p></div>
</div>

<script>
/* ============ SETTINGS ============
   SHEET_CSV_URL: "Publish to web" CSV link of the publications tab (live data).
   SNAPSHOT_CSV: saved copy of the sheet next to this page (shown first, fast).
   The copy is updated every hour by .github/workflows/update-publications.yml */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRso0GBCO-nlqSDNI56TACyZL2AKfRhADiAGdiAb7vWJ-eQsTswktN7kzXDPfDqoBkUODPf2jjn84_K/pub?gid=1070292077&single=true&output=csv";
const SNAPSHOT_CSV = "publications.csv";
/* ================================== */

function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c=='"'){ if(text[i+1]=='"'){f+='"';i++;} else q=false; }
      else f+=c;
    }else if(c=='"') q=true;
    else if(c==','){ row.push(f); f=""; }
    else if(c=='\n'||c=='\r'){
      if(c=='\r'&&text[i+1]=='\n') i++;
      row.push(f); rows.push(row); row=[]; f="";
    }else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  const head=rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(v=>v.trim()!==""))
    .map(r=>Object.fromEntries(head.map((h,i)=>[h,(r[i]||"").trim()])));
}

const isShown = v => /^(true|yes|y|1|x|✓|show)$/i.test(String(v||"").trim());
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const urlsIn = s => (String(s||"").match(/https?:\/\/[^\s,]+/g)||[]);

// Order of the sections on the page (conferences first)
const SECTIONS = [
  ["Conference Paper","Conference Papers","conf-papers"],
  ["Conference Poster","Conference Posters","conf-posters"],
  ["Conference Presentation","Conference Presentations","conf-ppt"],
  ["Journal Paper","Journal Papers","journal-papers"],
  ["Pre-print","Pre-Prints","pre-print"],
  ["Op Ed","Op Eds","op-ed"],
  ["Gallery Exhibit","Gallery Exhibits","gallery-ex"],
  ["Talk","Talks","talks"]
];
// YouTube links are shown as an embedded player under the item
function ytId(u){
  const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  return m?m[1]:null;
}
const norm = s => String(s||"").toLowerCase().replace(/[^a-z]/g,"").replace(/s$/,"");
let ALL=[];
// current filter choices
const F={section:"all",year:"all",q:""};

const ICON={
  paper:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  pdf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5"/><path d="M4 19h16"/></svg>',
  slides:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4m-4 0h8"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
};
// picks a button label from the address
function kind(u, main){
  if(/\.pdf(\?|#|$)/i.test(u)) return ["pdf","PDF"];
  if(/docs\.google\.com\/presentation/i.test(u)) return ["slides","Slides"];
  if(ytId(u)) return ["play","Video"];
  return main ? ["paper","View paper"] : ["link","More"];
}
const btn=(u,[ic,label])=>`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${ICON[ic]}${label}</a>`;

// takes the title out of the reference, so it is not shown twice
function withoutTitle(ref,title){
  if(!title) return ref;
  const i=ref.toLowerCase().indexOf(title.toLowerCase());
  if(i<0) return ref;
  let a=ref.slice(0,i), b=ref.slice(i+title.length);
  a=a.replace(/[\s"“”']+$/,"");
  b=b.replace(/^[\s"“”'.,]+/,"").replace(/^[\s"“”'.,]+/,"");
  return (a+(b?" "+b:"")).trim();
}
const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u=>{
    const clean=u.replace(/[.,;)]+$/,""); const tail=u.slice(clean.length);
    return `<a href="${clean}" target="_blank" rel="noopener">${clean}</a>${tail}`;
  });

function cardHTML(p){
  // with a Title: bold title + the rest of the reference in gray; without: the reference as before
  let extra=p.extra, text;
  if(p.title){
    // long web addresses in the gray line become buttons instead
    let meta=withoutTitle(p.ref,p.title);
    const inMeta=(meta.match(/https?:\/\/[^\s,]+/g)||[]).map(u=>u.replace(/[.,;)]+$/,""));
    meta=meta.replace(/,?\s*https?:\/\/[^\s,]+/g,"").replace(/[\s,]+$/,"");
    extra=[...extra,...inMeta];
    text=`<div class="pub-title">${esc(p.title)}</div><div class="pub-meta">${esc(meta)}</div>`;
  } else text=linkify(p.ref);
  const seen=new Set(); const btns=[];
  [[p.link,true],...extra.map(u=>[u,false])].forEach(([u,main])=>{
    if(!u||seen.has(u)) return; seen.add(u); btns.push(btn(u,kind(u,main)));
  });
  p.video.forEach(u=>{
    btns.push(ytId(u)
      ? `<button type="button" class="btn" data-yt="${ytId(u)}">${ICON.play}Watch video</button>`
      : btn(u,["play","Video"]));
  });
  return `<li class="card"><div class="card-top">`
    + (p.year?`<span class="year">${esc(p.year)}</span>`:"")
    + `<div class="pub-text">${text}</div></div>`
    + (btns.length?`<div class="actions">${btns.join("")}</div>`:"")
    + `</li>`;
}

// "Watch video" opens the player inside the card
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-yt]"); if(!b) return;
  const card=b.closest(".card"); const open=card.querySelector(".video");
  if(open){ open.remove(); b.lastChild.textContent="Watch video"; return; }
  card.insertAdjacentHTML("beforeend",`<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1" title="Video" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`);
  b.lastChild.textContent="Hide video";
});

function groupAll(){
  const groups=SECTIONS.map(([key,title,id])=>({title,id,items:ALL.filter(p=>norm(p.type)===norm(key))}));
  const known=new Set(SECTIONS.map(s=>norm(s[0])));
  const other=ALL.filter(p=>!known.has(norm(p.type)));
  if(other.length) groups.push({title:"Other",id:"other",items:other});
  const shown=groups.filter(g=>g.items.length);
  // newest first inside each section
  shown.forEach(g=>g.items.sort((a,b)=>(parseInt(b.year)||0)-(parseInt(a.year)||0)));
  return shown;
}

// does an item pass the year + search filters?
function passes(p){
  if(F.year!=="all" && p.year!==F.year) return false;
  if(F.q){
    const hay=(p.title+" "+p.ref+" "+p.type+" "+p.year).toLowerCase();
    if(!F.q.toLowerCase().split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  return true;
}

function drawFilters(groups){
  const nav=document.getElementById('nav');
  if(!groups.length){ nav.innerHTML=""; return; }
  const years=[...new Set(ALL.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a);
  const chip=(id,label,n)=>`<button type="button" class="chip" data-sec="${id}" aria-pressed="${F.section===id}">${esc(label)}<span class="n">${n}</span></button>`;
  nav.innerHTML='<hr><div class="filters"><div class="chips" role="group" aria-label="Filter by type">'
    + chip("all","All",ALL.length)
    + groups.map(g=>chip(g.id,g.title,g.items.length)).join("")
    + '</div><div class="tools">'
    + '<select id="year" aria-label="Filter by year"><option value="all">All years</option>'
    + years.map(y=>`<option value="${y}"${F.year===y?" selected":""}>${y}</option>`).join("")
    + '</select>'
    + `<input id="q" type="search" placeholder="Search title or author…" aria-label="Search publications" value="${esc(F.q)}">`
    + '</div></div><hr>';
  // after a filter change, go back to the top of the list
  const toTop=()=>{ try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){} };
  nav.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    F.section=b.dataset.sec; render(); toTop();
    const a=document.querySelector(`.chip[data-sec="${F.section}"]`);
    // keep the chosen button visible in the swipeable row (phones)
    if(a){ const row=a.parentNode; row.scrollLeft=a.offsetLeft-row.offsetLeft-(row.clientWidth-a.offsetWidth)/2; }
  });
  nav.querySelector('#year').onchange=e=>{ F.year=e.target.value; render(); toTop(); };
  nav.querySelector('#q').oninput=e=>{ F.q=e.target.value.trim(); drawList(groupAll()); };
}

function drawList(groups){
  const list=document.getElementById('list');
  const vis=groups
    .filter(g=>F.section==="all"||g.id===F.section)
    .map(g=>({...g,items:g.items.filter(passes)}))
    .filter(g=>g.items.length);
  const n=vis.reduce((a,g)=>a+g.items.length,0);
  const filtered=F.section!=="all"||F.year!=="all"||F.q;
  document.getElementById('count').textContent = filtered ? `Showing ${n} of ${ALL.length}` : "";
  list.innerHTML = vis.length ? vis.map(g=>
    `<h3 id="${g.id}">${esc(g.title)}<span class="n">(${g.items.length})</span></h3><ul class="cards">`+g.items.map(cardHTML).join("")+`</ul>`).join("")
    : `<p class="status">${ALL.length?"No publications match these filters.":"No publications to show."}</p>`;
  if(F.q) highlight(list, F.q);
}

// wraps the searched words in <mark> (only in visible text, never inside link addresses)
function highlight(root, q){
  const words=[...new Set(q.toLowerCase().split(/\s+/).filter(Boolean))]
    .sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  if(!words.length) return;
  const re=new RegExp("("+words.join("|")+")","gi");
  const has=new RegExp(words.join("|"),"i");
  const walker=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode:n=>n.parentNode.closest(".pub-text") && has.test(n.nodeValue)
      ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
  });
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment();
    n.nodeValue.split(re).forEach((part,i)=>{
      if(!part) return;
      if(i%2){ const m=document.createElement("mark"); m.textContent=part; frag.appendChild(m); }
      else frag.appendChild(document.createTextNode(part));
    });
    n.parentNode.replaceChild(frag,n);
  });
}

function render(){
  const groups=groupAll();
  if(F.section!=="all" && !groups.some(g=>g.id===F.section)) F.section="all";
  drawFilters(groups);
  drawList(groups);
}

// turns the rows of the sheet into the items shown on the page
function toItems(rows){
  return rows.filter(r=>isShown(r["Show"]) && (r["Papers"]||"").trim())
    .map(r=>({
      ref:r["Papers"].replace(/\s*\n\s*/g," "),
      title:(r["Title"]||"").replace(/\s*\n\s*/g," ").trim(),
      link:urlsIn(r["Links"])[0]||"",
      type:(r["Paper Type"]||"").trim(),
      year:String(parseInt(r["Year"])||"").trim(),
      extra:urlsIn(r["Extra Links"]),
      video:urlsIn(r["Video"])
    }));
}

// downloads a CSV and checks it really is the publications sheet
async function getText(url){
  const res=await fetch(url,{cache:"no-cache"});
  if(!res.ok) throw new Error(res.status);
  const text=await res.text();
  if(!/^\uFEFF?Papers\s*,/.test(text)) throw new Error("unexpected CSV");
  return text;
}

// draws the list, but only if the data is different from what is already shown
let shownText=null;
function show(text){
  if(text===shownText) return;
  shownText=text; ALL=toItems(parseCSV(text)); render();
}

async function load(){
  // 1) fast: the saved copy next to this page
  try{ show(await getText(SNAPSHOT_CSV)); }catch(e){}
  // 2) fresh: the live Google Sheet (redraws only if something changed)
  try{ show(await getText(SHEET_CSV_URL)); }
  catch(e){
    if(shownText===null)
      document.getElementById('list').innerHTML='<p class="status">Could not load the publications list. Please try again later.</p>';
  }
}
load();
</script>
</body>
</html>
